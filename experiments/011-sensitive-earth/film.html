const C={ink:'#061521',edge:'#e6d7b2',sand:'#c29b6d',copper:'#bd8255',mint:'#8cd7b2',teal:'#62bcb8',gold:'#f2ca86',violet:'#c6a6dc',water:'#446a7b',paper:'#f1e5ca'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,f)=>a+(b-a)*f;
const env=(t,a,b,r=1.5)=>ease((t-a)/r)*(1-ease((t-b)/r));
const rgba=(hex,a)=>{const k=hex.slice(1);return `rgba(${parseInt(k.slice(0,2),16)},${parseInt(k.slice(2,4),16)},${parseInt(k.slice(4,6),16)},${a})`};
