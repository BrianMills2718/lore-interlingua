name: Validate semantic corpus and visual scene contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments/001-lunar-nourishment -p 'test_*.py' -v
      - run: python -m unittest discover -s experiments/002-seven-rays -p 'test_*.py' -v
